# ─────────────────────────────────────────────
# Playbook: run_containers
# Runs the sysad-portfolio container on all VMs
# ─────────────────────────────────────────────

- name: Run sysad-portfolio containers on all VMs
  hosts: all_vms
  become: yes

  vars:
    image_name: sysad-portfolio
    image_tag: latest
    container_name: sysad-portfolio-app
    host_port: 8080
    container_port: 80

  roles:
    - run_container