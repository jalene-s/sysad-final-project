# ─────────────────────────────────────────────
# Ansible Configuration
# Defines SSH access, inventory, and Docker collections
# ─────────────────────────────────────────────

[defaults]
private_key_file = #put here the path to your private key file
inventory = inventory.ini
host_key_checking = False
remote_user = root
retry_files_enabled = False
collections_paths = ~/.ansible/collections

[privilege_escalation]
become = True
become_method = sudo
become_user = root