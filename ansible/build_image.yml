# ─────────────────────────────────────────────
# Playbook: build_image
# Builds the sysad-portfolio Docker image on all VMs
# ─────────────────────────────────────────────

- name: Install Docker and build Docker image on all VMs
  hosts: all_vms
  become: yes

  vars:
    image_name: sysad-portfolio
    image_tag: latest
    project_src: "{{ playbook_dir }}/../"
    remote_project_dir: /opt/sysad-portfolio

  roles:
    - install_docker
    - build_image